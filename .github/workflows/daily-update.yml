name: 🛡️ Daily SOC Intel Update

on:
  # Run every day at 06:00 UTC (adjustable)
  schedule:
    - cron: '0 6 * * *'
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if report already exists'
        required: false
        default: 'false'

# Permissions needed to push commits
permissions:
  contents: write

jobs:
  update-soc-intel:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Set up Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the SOC news fetcher
      - name: 🔍 Fetch SOC Intelligence
        run: |
          cd ${{ github.workspace }}
          python scripts/fetch_soc_news.py
        env:
          PYTHONUNBUFFERED: "1"

      # Step 5: Configure Git
      - name: ⚙️ Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "SOC Intel Bot 🛡️"

      # Step 6: Commit and push changes
      - name: 📤 Commit & Push Daily Report
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          
          # Add all changed files
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit today."
          else
            git commit -m "🛡️ SOC Intel Report — ${DATE}

          📊 Daily cybersecurity intelligence update
          🔍 Automated threat analysis from multiple sources
          📅 Report: reports/${DATE:0:4}/${DATE:5:2}/${DATE}.md

          Sources: CISA, Krebs, BleepingComputer, The Hacker News & more
          Generated by: SOC Daily Intel Bot"
            
            git push
            echo "✅ Report committed and pushed successfully!"
          fi

      # Step 7: Summary
      - name: 📋 Job Summary
        if: always()
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          echo "## 🛡️ SOC Daily Intel Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Report**: \`reports/${DATE:0:4}/${DATE:5:2}/${DATE}.md\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Keeping your GitHub green while staying informed on cybersecurity threats* 🟢" >> $GITHUB_STEP_SUMMARY
